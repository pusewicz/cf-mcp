name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.3'
          - '4.0.7'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # bundler-cache restores gems, not the RBS collection that Steep and the
      # signature tests load.
      - name: Cache RBS collection
        uses: actions/cache@v6
        with:
          path: .gem_rbs_collection
          key: rbs-collection-${{ hashFiles('rbs_collection.lock.yaml') }}
      - name: Install RBS collection
        run: bundle exec rbs collection install --frozen
      - name: Run the default task
        run: bundle exec rake
